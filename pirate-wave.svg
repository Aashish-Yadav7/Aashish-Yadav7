<svg viewBox="0 -30 1000 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- pirate fleet: lead ship out front, three smaller ships trailing behind in a V -->
<path fill="#3b82c4" opacity="0.35" d="M0,160 Q80,135 160,160 T320,160 T480,160 T640,160 T800,160 T1000,160 V300 H0 Z">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M0,160 Q80,135 160,160 T320,160 T480,160 T640,160 T800,160 T1000,160 V300 H0 Z;M0,160 Q80,185 160,160 T320,160 T480,160 T640,160 T800,160 T1000,160 V300 H0 Z;M0,160 Q80,135 160,160 T320,160 T480,160 T640,160 T800,160 T1000,160 V300 H0 Z"/>
    </path>
<path fill="#2f6fb0" opacity="0.55" d="M0,185 Q80,160 160,185 T320,185 T480,185 T640,185 T800,185 T1000,185 V300 H0 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0,185 Q80,160 160,185 T320,185 T480,185 T640,185 T800,185 T1000,185 V300 H0 Z;M0,185 Q80,210 160,185 T320,185 T480,185 T640,185 T800,185 T1000,185 V300 H0 Z;M0,185 Q80,160 160,185 T320,185 T480,185 T640,185 T800,185 T1000,185 V300 H0 Z"/>
    </path>
<path fill="#1f5f9e" opacity="0.85" d="M0,210 Q80,185 160,210 T320,210 T480,210 T640,210 T800,210 T1000,210 V300 H0 Z">
