<svg viewBox="0 -30 1000 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- pirate fleet: one lead ship out front, four smaller ones trailing behind in a V shape -->
<!-- back wave -->
<path fill="#1f6feb" opacity="0.85" d="M0,175 Q80,150 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V300 H0 Z">
  <animate attributeName="d" dur="6s" repeatCount="indefinite"
    values="
    M0,175 Q80,150 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V300 H0 Z;
    M0,175 Q80,200 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V300 H0 Z;
    M0,175 Q80,150 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V300 H0 Z
    "/>
</path>
<!-- lead ship -->

    <g transform="translate(500,150) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="500,150; 500,142; 500,150; 500,156; 500,150" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;10;0;-10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
<!-- trailing ships, left side of the V -->

    <g transform="translate(360,190) scale(0.9)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="360,190; 360,182; 360,190; 360,196; 360,190" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;10;0;-10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>

    <g transform="translate(230,220) scale(0.7)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="230,220; 230,212; 230,220; 230,226; 230,220" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;-10;0;10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
<!-- trailing ships, right side of the V -->

    <g transform="translate(640,190) scale(0.9)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="640,190; 640,182; 640,190; 640,196; 640,190" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;-10;0;10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>

    <g transform="translate(770,220) scale(0.7)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="770,220; 770,212; 770,220; 770,226; 770,220" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;10;0;-10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
<!-- front wave, sits over the ships' waterlines -->
<path fill="#1f6feb" d="M0,205 Q80,185 160,205 T320,205 T480,205 T640,205 T800,205 T1000,205 V300 H0 Z">
  <animate attributeName="d" dur="4s" repeatCount="indefinite"
    values="
    M0,205 Q80,185 160,205 T320,205 T480,205 T640,205 T800,205 T1000,205 V300 H0 Z;
    M0,205 Q80,225 160,205 T320,205 T480,205 T640,205 T800,205 T1000,205 V300 H0 Z;
    M0,205 Q80,185 160,205 T320,205 T480,205 T640,205 T800,205 T1000,205 V300 H0 Z
    "/>
</path>
</svg>
