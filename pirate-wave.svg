    </g>
<path fill="#1a4f86" opacity="1.0" d="M0,230 Q80,205 160,230 T320,230 T480,230 T640,230 T800,230 T1000,230 V300 H0 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,230 Q80,205 160,230 T320,230 T480,230 T640,230 T800,230 T1000,230 V300 H0 Z;M0,230 Q80,255 160,230 T320,230 T480,230 T640,230 T800,230 T1000,230 V300 H0 Z;M0,230 Q80,205 160,230 T320,230 T480,230 T640,230 T800,230 T1000,230 V300 H0 Z"/>
