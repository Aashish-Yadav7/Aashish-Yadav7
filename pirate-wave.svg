      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;10;0;-10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
<!-- trailing ships -->

    <g transform="translate(340,195) scale(0.85)">
      <animateTransform attributeName="transform" type="translate" dur="4s"
        values="340,195; 340,187; 340,195; 340,201; 340,195" additive="sum" repeatCount="indefinite"/>
      <path d="M-80,0 L80,0 L64,32 L-64,32 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
      <rect x="-4" y="-84" width="8" height="84" fill="#3b2412"/>
      <path d="M0,-78 Q42,-60 0,-30 Z" fill="#111820" opacity="0.9"/>
      <path d="M0,-78 L26,-72 L0,-66 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
        <animateTransform attributeName="transform" type="skewX" values="0;10;0;-10;0" dur="2s" repeatCount="indefinite" additive="sum"/>
