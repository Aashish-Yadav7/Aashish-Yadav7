<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0a3d91"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="260" fill="url(#sky)"/>

  <!-- Back wave -->
  <path fill="url(#waveBack)" opacity="0.55">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
      M0,175 Q80,150 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V260 H0 Z;
      M0,175 Q80,200 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V260 H0 Z;
      M0,175 Q80,150 160,175 T320,175 T480,175 T640,175 T800,175 T1000,175 V260 H0 Z
      "/>
  </path>

  <!-- CRUISE SHIP (ahead, ambling forward) -->
  <g id="cruise">
    <animateTransform attributeName="transform" type="translate" dur="5s"
      values="0,0; 0,-6; 0,0; 0,5; 0,0" repeatCount="indefinite"/>

    <!-- hull -->
    <path d="M700,150 L860,150 L845,180 L715,180 Z" fill="#e6edf3" stroke="#8b949e" stroke-width="2"/>
    <rect x="715" y="180" width="130" height="6" fill="#1f6feb"/>
    <!-- deck levels -->
    <rect x="715" y="128" width="130" height="24" rx="3" fill="#c9d1d9" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="735" y="106" width="80" height="24" rx="3" fill="#e6edf3" stroke="#8b949e" stroke-width="1.5"/>
    <!-- windows -->
    <g fill="#0A66C2">
      <rect x="722" y="134" width="6" height="8"/>
      <rect x="736" y="134" width="6" height="8"/>
      <rect x="750" y="134" width="6" height="8"/>
      <rect x="764" y="134" width="6" height="8"/>
      <rect x="778" y="134" width="6" height="8"/>
      <rect x="792" y="134" width="6" height="8"/>
      <rect x="806" y="134" width="6" height="8"/>
      <rect x="820" y="134" width="6" height="8"/>
      <rect x="742" y="112" width="6" height="8"/>
      <rect x="756" y="112" width="6" height="8"/>
      <rect x="770" y="112" width="6" height="8"/>
      <rect x="784" y="112" width="6" height="8"/>
      <rect x="798" y="112" width="6" height="8"/>
    </g>
    <!-- funnel -->
    <rect x="765" y="80" width="14" height="26" rx="2" fill="#f85149"/>
    <rect x="763" y="78" width="18" height="6" rx="1" fill="#e6edf3"/>
    <!-- smoke -->
    <g fill="#8b949e">
      <circle cx="772" cy="70" r="5">
        <animate attributeName="cy" values="70;40;70" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="778" cy="66" r="4">
        <animate attributeName="cy" values="66;30;66" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;8;4" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- PIRATE GALLEON (behind, chasing) -->
  <g id="ship">
    <animateTransform attributeName="transform" type="translate" dur="4s"
      values="0,0; 0,-10; 0,0; 0,7; 0,0" repeatCount="indefinite"/>

    <!-- hull, larger and more detailed -->
    <path d="M330,168 L470,168 L455,205 L345,205 Z" fill="#6e4423" stroke="#3b2412" stroke-width="2"/>
    <path d="M330,168 L470,168 L462,180 L338,180 Z" fill="#8a5a30" stroke="#3b2412" stroke-width="1"/>
    <!-- deck rail -->
    <rect x="345" y="160" width="110" height="8" fill="#4a2c14"/>

    <!-- bowsprit -->
    <path d="M462,168 L495,158" stroke="#3b2412" stroke-width="4"/>

    <!-- rear mast -->
    <rect x="360" y="70" width="5" height="98" fill="#3b2412"/>
    <path d="M363,76 Q400,92 363,120 Z" fill="#111820" opacity="0.9"/>
    <!-- main mast -->
    <rect x="418" y="45" width="6" height="123" fill="#3b2412"/>
    <path d="M421,52 Q470,72 421,110 Z" fill="#111820" opacity="0.9"/>
    <path d="M421,110 Q460,126 421,150 Z" fill="#111820" opacity="0.85"/>

    <!-- crow's nest -->
    <rect x="412" y="42" width="18" height="8" rx="2" fill="#3b2412"/>

    <!-- skull flag -->
    <path d="M421,42 L448,49 L421,56 Z" fill="#161b22" stroke="#8b949e" stroke-width="1">
      <animateTransform attributeName="transform" type="skewX" values="0;12;0;-12;0" dur="2s" repeatCount="indefinite" additive="sum"/>
    </path>
    <circle cx="432" cy="49" r="3.2" fill="#e6edf3">
      <animateTransform attributeName="transform" type="skewX" values="0;12;0;-12;0" dur="2s" repeatCount="indefinite" additive="sum"/>
    </circle>

    <!-- speech bubble -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.45;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      <rect x="470" y="70" rx="10" ry="10" width="70" height="34" fill="#161b22" stroke="#39D353" stroke-width="1.5"/>
      <polygon points="480,104 490,104 480,115" fill="#161b22" stroke="#39D353" stroke-width="1.5"/>
      <text x="505" y="92" font-family="Fira Code, monospace" font-size="16" fill="#39D353" text-anchor="middle">Hi! 👋</text>
    </g>

    <!-- burp cloud puff, timed to happen right after the speech bubble -->
    <g>
      <circle cx="500" cy="76" r="0" fill="#e6edf3" opacity="0">
        <animate attributeName="r" values="0;0;3;10;16;16" keyTimes="0;0.75;0.8;0.9;1;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.85;0.5;0;0" keyTimes="0;0.75;0.8;0.9;1;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="76;76;70;58;44;44" keyTimes="0;0.75;0.8;0.9;1;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="512" cy="80" r="0" fill="#e6edf3" opacity="0">
        <animate attributeName="r" values="0;0;2;7;12;12" keyTimes="0;0.78;0.83;0.92;1;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.75;0.4;0;0" keyTimes="0;0.78;0.83;0.92;1;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;80;74;62;48;48" keyTimes="0;0.78;0.83;0.92;1;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Front wave, over ships' waterlines -->
  <path fill="url(#waveFront)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="
      M0,195 Q80,175 160,195 T320,195 T480,195 T640,195 T800,195 T1000,195 V260 H0 Z;
      M0,195 Q80,215 160,195 T320,195 T480,195 T640,195 T800,195 T1000,195 V260 H0 Z;
      M0,195 Q80,175 160,195 T320,195 T480,195 T640,195 T800,195 T1000,195 V260 H0 Z
      "/>
  </path>
</svg>
