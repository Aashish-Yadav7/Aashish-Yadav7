<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- radar/spider chart, same idea as a game stats screen -->
<!-- background rings just help the eye judge distance from center, three of them at different sizes -->
<polygon points="350.0,234.0 416.0,300.0 350.0,366.0 284.0,300.0" fill="none" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<polygon points="350.0,168.0 482.0,300.0 350.0,432.0 218.0,300.0" fill="none" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<polygon points="350.0,100.0 550.0,300.0 350.0,500.0 150.0,300.0" fill="none" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<line x1="350" y1="300" x2="350.0" y2="100.0" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<line x1="350" y1="300" x2="550.0" y2="300.0" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<line x1="350" y1="300" x2="350.0" y2="500.0" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<line x1="350" y1="300" x2="150.0" y2="300.0" stroke="#26a641" stroke-width="1" opacity="0.35"/>
<polygon points="350.0,140.0 460.0,300.0 350.0,480.0 220.0,300.0" fill="#39D353" fill-opacity="0.35" stroke="#39D353" stroke-width="3">
<animate attributeName="fill-opacity" values="0.35;0.5;0.35" dur="3s" repeatCount="indefinite"/>
</polygon>
<text x="350.0" y="65.0" font-family="Fira Code, monospace" font-size="20" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Languages</text>
<text x="585.0" y="300.0" font-family="Fira Code, monospace" font-size="20" fill="#e6edf3" text-anchor="start" dominant-baseline="middle">Consistency</text>
<text x="350.0" y="535.0" font-family="Fira Code, monospace" font-size="20" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Projects</text>
<text x="115.0" y="300.0" font-family="Fira Code, monospace" font-size="20" fill="#e6edf3" text-anchor="end" dominant-baseline="middle">Activity</text>
</svg>
